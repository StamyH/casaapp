<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5C6BC0" />
    <meta name="description" content="CasaApp — gestione casa condivisa" />

    <!-- PWA su iOS: fullscreen, status bar trasparente, nome icona -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CasaApp" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!-- Splash screen per iOS — immagine generica, copre la maggior parte dei device -->
    <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/logo512.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>CasaApp</title>
    <script>
      // Ripristina l'URL dopo il redirect da 404.html (SPA routing su GitHub Pages)
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded[0] +
            (decoded[1] ? '?' + decoded[1] : '') + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <noscript>Abilita JavaScript per usare CasaApp.</noscript>
    <div id="root"></div>
  </body>
</html>
